insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660

set timeout=5
set default=0

menuentry "FunkyOS (Ghost Edition)" {
    set gfxpayload=keep
    linux /arch/boot/x86_64/vmlinuz-linux archisobasedir=arch archisolabel=FUNKY_GHOST cow_spacesize=2G
    initrd /arch/boot/x86_64/initramfs-linux.img
}
