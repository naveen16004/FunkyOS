k# FunkyOS GRUB Config
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660

set timeout=5
set default=0

menuentry "FunkyOS Ghost System (x86_64)" {
    set gfxpayload=keep
    search --no-floppy --set=root --label FUNKY_GHOST
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisolabel=FUNKY_GHOST
    initrd /%INSTALL_DIR%/boot/intel-ucode.img /%INSTALL_DIR%/boot/amd-ucode.img /%INSTALL_DIR%/boot/x86_64/initlinux.img
}
